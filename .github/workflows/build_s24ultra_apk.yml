name: Build S24 Ultra APK (arm64-v8a, API 36)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SHA-256 manifest and JSON files
        run: |
          chmod +x scripts/generate_sha256_manifest.sh
          ./scripts/generate_sha256_manifest.sh
          test -f device_profile/artifacts.sha256
          test -f device_profile/sha256_sync_status.json
          python3 -m json.tool device_profile/hardware_matrix.json >/dev/null
          python3 -m json.tool device_profile/sha256_sync_status.json >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: "35.0.0"

      - name: Accept Android SDK licenses and install platforms/build-tools
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Build Debug and Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Collect and checksum APK artifacts
        run: |
          mkdir -p artifacts_out
          cp app/build/outputs/apk/debug/*.apk artifacts_out/ || true
          cp app/build/outputs/apk/release/*.apk artifacts_out/ || true
          sha256sum artifacts_out/*.apk > artifacts_out/apk_checksums.sha256 || true
          ls -lh artifacts_out/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spotify-s24ultra-apk-arm64-api36
          path: artifacts_out/
