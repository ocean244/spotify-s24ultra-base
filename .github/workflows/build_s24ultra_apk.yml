name: Build Signed S24 Ultra APK (arm64-v8a, API 36)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SHA-256 manifest and JSON files
        run: |
          chmod +x scripts/generate_sha256_manifest.sh
          ./scripts/generate_sha256_manifest.sh
          test -f device_profile/artifacts.sha256
          test -f device_profile/sha256_sync_status.json
          python3 -m json.tool device_profile/hardware_matrix.json >/dev/null
          python3 -m json.tool device_profile/sha256_sync_status.json >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: "35.0.0"

      - name: Install Android SDK platform 36 and build-tools 35.0.0
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"

      - name: Ensure Gradle Wrapper is present
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.11.1 --distribution-type all
          fi
          chmod +x ./gradlew

      - name: Prepare Release Keystore for APK signing
        env:
          KEY_STORE_PASS: "S24UltraReleaseStore2026!"
          KEY_ALIAS_PASS: "S24UltraReleaseKey2026!"
          KEY_ALIAS_NAME: "s24ultra_release_key"
        run: |
          mkdir -p /tmp/signing
          keytool -genkeypair -v \
            -keystore /tmp/signing/s24ultra-release.jks \
            -storepass "${KEY_STORE_PASS}" \
            -alias "${KEY_ALIAS_NAME}" \
            -keypass "${KEY_ALIAS_PASS}" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=SpotifyS24UltraBase, OU=Engineering, O=SM-S928B, L=Darlowo, ST=Zachodniopomorskie, C=PL"
          echo "ANDROID_KEYSTORE_PATH=/tmp/signing/s24ultra-release.jks" >> "${GITHUB_ENV}"
          echo "ANDROID_KEYSTORE_PASSWORD=${KEY_STORE_PASS}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_ALIAS=${KEY_ALIAS_NAME}" >> "${GITHUB_ENV}"
          echo "ANDROID_KEY_PASSWORD=${KEY_ALIAS_PASS}" >> "${GITHUB_ENV}"

      - name: Build Debug and Signed Release APK
        run: |
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify APK signature and collect artifacts
        run: |
          mkdir -p artifacts_out
          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            if [ -f "${apk}" ]; then
              cp "${apk}" artifacts_out/
              "${BUILD_TOOLS_DIR}/apksigner" verify --print-certs "${apk}" || true
            fi
          done
          (cd artifacts_out && sha256sum *.apk > apk_checksums.sha256)
          ls -lh artifacts_out/
          cat artifacts_out/apk_checksums.sha256

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spotify-s24ultra-apk-arm64-api36
          path: artifacts_out/

      - name: Publish latest APK release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "s24ultra-latest" --yes >/dev/null 2>&1 || true
          git tag -d "s24ultra-latest" >/dev/null 2>&1 || true
          git push origin :refs/tags/s24ultra-latest >/dev/null 2>&1 || true
          gh release create "s24ultra-latest" artifacts_out/*.apk artifacts_out/apk_checksums.sha256 \
            --title "Spotify S24 Ultra Base APK (arm64-v8a, API 36)" \
            --notes "Automated signed Debug and Release APKs for SM-S928B (e3q) with SHA-256 verification."
