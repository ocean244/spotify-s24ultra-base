name: Build Signed S24 Ultra APK (arm64-v8a, API 36)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify SHA-256 manifest and JSON files
        run: |
          chmod +x scripts/generate_sha256_manifest.sh
          ./scripts/generate_sha256_manifest.sh
          test -f device_profile/artifacts.sha256
          test -f device_profile/sha256_sync_status.json
          python3 -m json.tool device_profile/hardware_matrix.json >/dev/null
          python3 -m json.tool device_profile/sha256_sync_status.json >/dev/null

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Configure Android SDK (API 36, Build-Tools 35.0.0)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          test -n "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1 || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "platforms;android-36" "build-tools;35.0.0"

      - name: Bootstrap Gradle 8.11.1 Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            mkdir -p gradle/wrapper
            curl -fsSL -o /tmp/gradle-8.11.1-bin.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
            unzip -q /tmp/gradle-8.11.1-bin.zip -d /tmp/gradle-dist
            /tmp/gradle-dist/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --distribution-type all
          fi
          chmod +x ./gradlew

      - name: Prepare Release Keystore for APK signing
        run: |
          rm -rf /tmp/signing
          mkdir -p /tmp/signing
          STORE_PASS="S24UltraKey2026"
          KEY_PASS="S24UltraKey2026"
          KEY_ALIAS="s24ultra_release_key"
          KS_PATH="/tmp/signing/s24ultra-release.jks"
          keytool -genkeypair -v \
            -keystore "${KS_PATH}" \
            -storetype PKCS12 \
            -storepass "${STORE_PASS}" \
            -alias "${KEY_ALIAS}" \
            -keypass "${KEY_PASS}" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=SpotifyS24UltraBase, OU=Engineering, O=SM-S928B, L=Darlowo, ST=Zachodniopomorskie, C=PL"
          keytool -list -v -keystore "${KS_PATH}" -storepass "${STORE_PASS}" >/dev/null
          echo "KS_PATH=${KS_PATH}" >> "${GITHUB_ENV}"
          echo "STORE_PASS=${STORE_PASS}" >> "${GITHUB_ENV}"
          echo "KEY_ALIAS=${KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "KEY_PASS=${KEY_PASS}" >> "${GITHUB_ENV}"

      - name: Build Debug and Signed Release APK
        run: |
          ./gradlew --no-daemon assembleDebug assembleRelease \
            -Pandroid.injected.signing.store.file="${KS_PATH}" \
            -Pandroid.injected.signing.store.password="${STORE_PASS}" \
            -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${KEY_PASS}"

      - name: Verify APK signature and collect artifacts
        run: |
          mkdir -p artifacts_out
          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            if [ -f "${apk}" ]; then
              cp "${apk}" artifacts_out/
              "${BUILD_TOOLS_DIR}/apksigner" verify --print-certs "${apk}"
            fi
          done
          (cd artifacts_out && sha256sum *.apk > apk_checksums.sha256)
          ls -lh artifacts_out/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spotify-s24ultra-apk-arm64-api36
          path: artifacts_out/

      - name: Publish latest APK release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "s24ultra-latest" --yes >/dev/null 2>&1 || true
          git tag -d "s24ultra-latest" >/dev/null 2>&1 || true
          git push origin :refs/tags/s24ultra-latest >/dev/null 2>&1 || true
          gh release create "s24ultra-latest" artifacts_out/*.apk artifacts_out/apk_checksums.sha256 \
            --title "Spotify S24 Ultra Base APK (arm64-v8a, API 36)" \
            --notes "Automated signed Debug and Release APKs for SM-S928B (e3q) with SHA-256 verification."
